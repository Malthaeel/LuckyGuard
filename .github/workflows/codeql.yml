name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / C#
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build .\LuckyGuard.sln -c Release
      - name: Analyze
        uses: github/codeql-action/analyze@v4
